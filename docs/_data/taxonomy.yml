providers:
  - { id: microsoft, label: Microsoft, validity_months: 12, renewal: "Free, unproctored renewal assessment on Microsoft Learn in the 6 months before expiry; fundamentals never expire." }
  - { id: github, label: GitHub, validity_months: 24, renewal: "Moving to Microsoft's renewal process; GH-900 needs no renewal." }
  - { id: aws, label: AWS, validity_months: 36, renewal: "Pass the current version of the exam or a higher-level one before expiry." }
  - { id: linux-foundation, label: Linux Foundation / CNCF, validity_months: 24, renewal: "Retake the current exam before expiry." }
  - { id: hashicorp, label: HashiCorp, validity_months: 24, renewal: "Retake the current exam before expiry." }
  - { id: isc2, label: ISC2, validity_months: 36, renewal: "Earn CPEs (CISSP: 120 per 3 years) and pay the annual maintenance fee." }
  - { id: isaca, label: ISACA, validity_months: 36, renewal: "Earn CPEs each year and pay the annual maintenance fee." }
  - { id: comptia, label: CompTIA, validity_months: 36, renewal: "Continuing education (CE) units within the 3-year cycle." }
  - { id: csa, label: Cloud Security Alliance, validity_months: 0, renewal: "CCSK does not expire." }
  - { id: iapp, label: IAPP, validity_months: 24, renewal: "20 CPEs and a renewal fee every 2 years (or IAPP membership)." }
  - { id: open-group, label: The Open Group, validity_months: 0, renewal: "No expiry stated in the TOGAF portfolio." }
  - { id: isaqb, label: iSAQB, validity_months: 0, renewal: "Valid for life." }
  - { id: finops, label: FinOps Foundation, validity_months: 24, renewal: "Renew through the FinOps Foundation before expiry." }
  - { id: offsec, label: OffSec, validity_months: 36, renewal: "Recertification exam or CPEs; the base certification does not expire." }
  - { id: pecb, label: PECB, validity_months: 36, renewal: "CPD hours and an annual fee." }
  - { id: anthropic, label: Anthropic, validity_months: 12, renewal: "Free on-time renewal." }
  - { id: nvidia, label: NVIDIA, validity_months: 24, renewal: "Retake the exam." }
  - { id: google, label: Google Cloud, validity_months: 24, renewal: "Retake the exam (validity varies by certification)." }

