# Controlled vocabularies for lwd. Order is display order.
# Every value used in front matter must appear here; `python -m lwd validate`
# suggests the closest match when one does not.

tracks:
  - { id: architect, label: Architect }
  - { id: agentic-ai, label: Agentic AI }
  - { id: security, label: Security }
  - { id: cloud, label: Cloud }

clouds:
  - { id: azure, label: Azure }
  - { id: aws, label: AWS }
  - { id: neutral, label: Vendor-neutral }

levels:
  - { id: foundation, label: Foundation, meaning: "Fundamentals-exam depth: what it is, why it exists, where it fits." }
  - { id: practitioner, label: Practitioner, meaning: "Associate/specialty depth: how to configure, operate and troubleshoot it." }
  - { id: expert, label: Expert, meaning: "Professional/expert depth: how to design with it and defend the trade-offs." }

fidelity:
  - { id: exact, label: Exact, rank: 3, meaning: "Functionally equivalent; knowledge transfers directly." }
  - { id: close, label: Close, rank: 2, meaning: "Same job; notable differences in model, limits or features." }
  - { id: partial, label: Partial, rank: 1, meaning: "Covers part of the scope; you need to combine services to match." }
  - { id: none, label: None, rank: 0, meaning: "No counterpart on the other cloud." }

volatility:
  - { id: ai, days: 90 }
  - { id: cloud, days: 180 }
  - { id: fundamentals, days: 730 }

