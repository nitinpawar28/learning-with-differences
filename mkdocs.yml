site_name: Learning with Differences
site_description: >-
  Trade-off comparisons, architectural patterns, and deep-dive learning notes
  across our production stack — .NET 9, Angular 20, Redis Streams, TimescaleDB,
  Docker Compose, and MCP.
site_author: Nitin Pawar
# site_url: https://<your-username>.github.io/learning-with-differences/

# Uncomment repo_name/repo_url/edit_uri once this is pushed to GitHub —
# they add a repo link + "edit this page" links in the header.
# repo_name: learning-with-differences
# repo_url: https://github.com/<your-username>/learning-with-differences
# edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Nitin Pawar

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+'

markdown_extensions:
  # Callouts (!!! note, !!! warning, etc.)
  - admonition
  - pymdownx.details

  # Code blocks: syntax highlighting + line numbers + copy button (via theme feature)
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Content tabs (pymdownx.tabbed) — used for .NET / Angular / SQL code comparisons
  - pymdownx.tabbed:
      alternate_style: true

  # Tables, TOC, general formatting
  - tables
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

