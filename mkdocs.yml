      - .NET Core / C#: messaging/dotnet-core-csharp.md
      - Async & Threading: messaging/async-threading.md
      - REST vs. gRPC APIs: messaging/rest-vs-grpc-apis.md
      - SignalR & WebSockets: messaging/signalr-websockets.md
      - Event-Driven vs. Request-Response: messaging/event-driven-vs-request-response.md
      - Redis Streams vs. Kafka: messaging/redis-streams-vs-kafka.md
      - Broker & Exchange API Integrations: messaging/broker-exchange-api-integrations.md
      - Outbox Pattern: messaging/outbox-pattern.md
      - Delivery Semantics: messaging/delivery-semantics.md
      - MCP Tool Orchestration: messaging/mcp-tool-orchestration.md
      - Microservices vs. Modular Monoliths: messaging/microservices-vs-modular-monoliths.md
  - Data & Storage Systems:
      - Overview: data/index.md
      - Relational Databases: data/relational-databases.md
      - Time-Series / Financial Schemas: data/time-series-financial-schemas.md
      - Row vs. Columnar Storage: data/row-vs-columnar-storage.md
      - High-Frequency Indexing & Partitioning: data/high-frequency-indexing-partitioning.md
  - Frontend & Real-Time UI:
      - Overview: frontend/index.md
      - Angular: frontend/angular-fundamentals.md
      - TypeScript: frontend/typescript.md
      - RxJS & State Management: frontend/rxjs-state-management.md
      - Real-Time UI Streaming: frontend/real-time-ui-streaming.md
  - DevOps & Cloud-Native:
      - Overview: devops/index.md
      - Docker & Containerization: devops/docker-containerization.md
      - CI/CD Pipelines: devops/ci-cd-pipelines.md
      - Bare-Metal Linux & Hypervisors: devops/bare-metal-linux-hypervisors.md
  - Security, Identity & Protocols:
      - Overview: security/index.md
      - mTLS vs. API Keys: security/mtls-vs-api-keys.md
      - Workload Identity: security/workload-identity.md
